name: Feature request
description: Suggest something new or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Other boorus that do this well, workarounds you use, and so on.
