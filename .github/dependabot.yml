version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    ignore:
      # Tags on this action are Rust versions; the msrv job pins it to rust-version.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
