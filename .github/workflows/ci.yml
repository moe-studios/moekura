name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The same Debian release as the container image, so media tests run
    # against the vips and ffmpeg that ship.
    container: rust:1.98-trixie
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: uwu
          POSTGRES_PASSWORD: uwu
          POSTGRES_DB: uwu
        options: >-
          --health-cmd "pg_isready -U uwu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
    env:
      # sqlx::test creates a throwaway database per test on this server.
      DATABASE_URL: postgres://uwu:uwu@postgres:5432/uwu
      # Rate limit and cache tests also run against a real Valkey.
      TEST_VALKEY_URL: redis://valkey:6379
    steps:
      - uses: actions/checkout@v5
      - name: Install media tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libvips-tools libheif-plugin-dav1d libheif-plugin-aomenc ffmpeg
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Search plans at scale
        # Seeds 200,000 posts and fails if a search that should be
        # selective reads most of the table.
        run: cargo test -p uwu-db --locked -- --ignored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The bundle is committed so building the binary needs no Node.
      - name: Committed bundle matches the sources
        run: git diff --exit-code -- ../crates/web/static/js

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag uwubooru:ci .
