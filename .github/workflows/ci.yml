name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features moekura/tagger -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The same Debian release as the container image, so media tests run
    # against the vips and ffmpeg that ship.
    container: rust:1.98-trixie
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: moekura
          POSTGRES_PASSWORD: moekura
          POSTGRES_DB: moekura
        options: >-
          --health-cmd "pg_isready -U moekura"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
    env:
      # sqlx::test creates a throwaway database per test on this server.
      DATABASE_URL: postgres://moekura:moekura@postgres:5432/moekura
      # Rate limit and cache tests also run against a real Valkey.
      TEST_VALKEY_URL: redis://valkey:6379
    steps:
      - uses: actions/checkout@v5
      - name: Install media tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libvips-tools libheif-plugin-dav1d libheif-plugin-aomenc ffmpeg
      - name: Install ONNX Runtime
        # The tagger's tests run a tiny model through it.
        run: |
          curl -fsSLo /tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.28.2/onnxruntime-linux-x64-1.28.2.tgz
          echo "d7209b8751b27b862b0c76332c2e20e203396edb5dab700ecf4bb485cf147415  /tmp/ort.tgz" | sha256sum -c -
          tar xzf /tmp/ort.tgz -C /opt
          echo "ORT_DYLIB_PATH=/opt/onnxruntime-linux-x64-1.28.2/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --features moekura/tagger
      - name: Search plans at scale
        # Seeds 200,000 posts and fails if a search that should be
        # selective reads most of the table. A minute, so only on main.
        # --workspace, like the step above, so nothing builds again.
        if: github.event_name == 'push'
        run: cargo test --workspace --locked --features moekura/tagger -- --ignored

  s3:
    # The S3 backend against a real S3-compatible server. (Service
    # containers can't be given a command, so it's started by hand.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start SeaweedFS
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:4.47 \
            server -s3 -dir=/data -ip.bind=0.0.0.0
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333/ && break; sleep 1; done
          curl -sf -X PUT http://localhost:8333/moekura-test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p moekura-storage --locked
        env:
          TEST_S3_ENDPOINT: http://localhost:8333
          TEST_S3_BUCKET: moekura-test
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The bundle is committed so building the binary needs no Node.
      - name: Committed bundle matches the sources
        run: git diff --exit-code -- ../crates/web/static/js

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  docker:
    runs-on: ubuntu-latest
    env:
      E2E_ADMIN_NAME: boss
      E2E_ADMIN_PASSWORD: e2e admin password
    steps:
      - uses: actions/checkout@v5
      - name: Version embedded in the binary
        run: echo "MOEKURA_BUILD_VERSION=git-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      # Layers cached between runs: the media tools rarely change, and the
      # Rust dependencies only with Cargo.lock.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: moekura:ci
          build-args: MOEKURA_BUILD_VERSION=${{ env.MOEKURA_BUILD_VERSION }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: The tagger image loads ONNX Runtime
        # Its layers are the app's plus the library.
        run: |
          docker buildx build --target tagger --load -t moekura:ci-tagger \
            --build-arg MOEKURA_BUILD_VERSION="$MOEKURA_BUILD_VERSION" \
            --cache-from type=gha,scope=ci .
          docker run --rm -e MOEKURA_DATABASE__URL=postgres://unused/unused moekura:ci-tagger tagger --check
      - name: Media tools work in the image
        # The image builds its own ffmpeg and libvips; run them on one file
        # of every accepted type, the way the app does.
        run: |
          docker volume create samples
          docker run --rm -v "$PWD/deploy/smoke:/smoke:ro" -v samples:/samples \
            debian:trixie sh /smoke/make-samples.sh
          docker run --rm --entrypoint sh -v "$PWD/deploy/smoke:/smoke:ro" \
            -v samples:/samples:ro moekura:ci /smoke/check.sh
      - run: docker image ls moekura:ci
      # End-to-end tests against the tiny compose stack, reusing the image
      # built above (compose calls it moekura-app), limited to what a
      # 1 GB VPS with two cores has.
      - name: Start the tiny stack
        env:
          POSTGRES_PASSWORD: e2e
        run: |
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" > deploy/.env
          docker tag moekura:ci moekura-app
          docker compose -f deploy/compose.tiny.yml -f e2e/compose.1gb.yml up -d --no-build --wait
          for i in $(seq 60); do curl -fsS http://localhost:8080/readyz && break; sleep 2; done
          curl -fsS http://localhost:8080/readyz
          printf '%s\n' "$E2E_ADMIN_PASSWORD" | docker compose -f deploy/compose.tiny.yml exec -T app \
            moekura admin create-user "$E2E_ADMIN_NAME" --role admin
          echo "app memory after start: $(deploy/smoke/rss.sh) MB"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Danbooru clients (gallery-dl)
        run: |
          pipx install gallery-dl==1.32.13
          e2e/clients/gallery-dl.sh
      - name: Memory stays small
        # docs/design.md: one `moekura serve` stays under about 150 MB
        # when idle. After the tests above, and after a burst of requests
        # (which also checks every page answers 200 OK).
        run: |
          echo "app memory after the tests: $(deploy/smoke/rss.sh) MB"
          docker compose -f deploy/compose.tiny.yml exec -T app \
            moekura admin bench-http --runs 500 --concurrency 32
          rss=$(deploy/smoke/rss.sh)
          echo "app memory after a burst of requests: $rss MB"
          if [ "$rss" -ge 150 ]; then
            echo "::error::moekura serve uses $rss MB, over 150 MB"
            exit 1
          fi
          docker stats --no-stream
      - name: Nothing ran out of memory
        run: |
          for service in app db; do
            id=$(docker compose -f deploy/compose.tiny.yml ps -q "$service")
            state=$(docker inspect -f '{{.State.OOMKilled}} {{.RestartCount}}' "$id")
            echo "$service: OOM killed, restarts: $state"
            if [ "$state" != "false 0" ]; then
              echo "::error::$service ran out of memory or restarted"
              exit 1
            fi
          done
      - name: Server logs
        if: failure()
        run: docker compose -f deploy/compose.tiny.yml logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.tiny.yml down -v
