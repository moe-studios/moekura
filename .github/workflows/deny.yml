name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories show up even when nothing changes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new advisory is rarely caused by the pull request it shows up on,
    # so it shouldn't block merging; the weekly run reports it instead.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
