name: Release

# Main publishes edge and commit-tagged app and tagger images (amd64 and
# arm64). Tags like v0.1.0 also publish semver images and a GitHub release
# with Linux binaries, its notes taken from CHANGELOG.md.

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the version, and the changelog has it
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$crate" = "$version" || { echo "Cargo.toml says $crate, the tag $version"; exit 1; }
          heading=$(grep -m1 "^## \[$version\]" CHANGELOG.md) \
            || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          if echo "$heading" | grep -q Unreleased; then
            echo "Give the $version section in CHANGELOG.md its release date"; exit 1
          fi
      - name: Version embedded in the binary
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="git-${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: check
    # Each architecture builds natively; emulated arm64 builds take hours.
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          build-args: MOEKURA_BUILD_VERSION=${{ needs.check.outputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      # The same layers plus ONNX Runtime.
      - id: build-tagger
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tagger
          build-args: MOEKURA_BUILD_VERSION=${{ needs.check.outputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.runner }}
      - name: Keep the digests for the manifests
        run: |
          mkdir -p "$RUNNER_TEMP/digests/app" "$RUNNER_TEMP/digests/tagger"
          app="${{ steps.build.outputs.digest }}"
          tagger="${{ steps.build-tagger.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/app/${app#sha256:}" "$RUNNER_TEMP/digests/tagger/${tagger#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Releases get semver tags (the major alone from 1.0, latest only for
      # stable releases), main
      # gets edge, and both get short and full commit tags. The tagger
      # gets the same tags with -tagger appended.
      - id: app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,prefix=git-
            type=sha,prefix=git-,format=long
      - id: tagger
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=-tagger,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,prefix=git-
            type=sha,prefix=git-,format=long
      - name: Publish one tag for both architectures, for each image
        working-directory: ${{ runner.temp }}/digests
        env:
          APP_TAGS: ${{ steps.app.outputs.json }}
          TAGGER_TAGS: ${{ steps.tagger.outputs.json }}
        run: |
          for image in app tagger; do
            if [ "$image" = app ]; then tags="$APP_TAGS"; else tags="$TAGGER_TAGS"; fi
            docker buildx imagetools create \
              $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$tags") \
              $(cd "$image" && printf "$IMAGE@sha256:%s " *)
          done
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$APP_TAGS")"
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$TAGGER_TAGS")"

  binaries:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    env:
      MOEKURA_BUILD_VERSION: ${{ needs.check.outputs.version }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # With the tagger; it needs ONNX Runtime installed to run.
      - run: cargo build --release --locked -p moekura --features tagger
      - name: Package
        run: |
          name="moekura-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/moekura LICENSE README.md CHANGELOG.md moekura.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: moekura-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [manifest, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\nImages: `ghcr.io/%s:%s`, and `ghcr.io/%s:%s-tagger` with the tagger\n' \
            "$GITHUB_REPOSITORY" "$version" "$GITHUB_REPOSITORY" "$version" >> notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
