[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/moe-studios/moekura"
publish = false

[workspace.dependencies]
moekura-core = { path = "crates/core" }
moekura-db = { path = "crates/db" }
moekura-jobs = { path = "crates/jobs" }
moekura-media = { path = "crates/media" }
moekura-net = { path = "crates/net" }
moekura-storage = { path = "crates/storage" }
moekura-tagger = { path = "crates/tagger" }
moekura-web = { path = "crates/web" }

anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
axum-extra = { version = "0.12.6", features = ["cookie", "form"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
futures-util = "0.3.34"
governor = "0.10.4"
# Tests speak HTTP/2 to the web server as clients that hold back.
h2 = "0.4.19"
hex = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
http-body-util = "0.1.5"
# The web server's connections, with the timeouts and limit axum::serve
# can't set.
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
# SMTP over rustls/ring, like the other TLS clients.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }
md-5 = "0.11.0"
# Prometheus /metrics: the `metrics` facade (no-ops until a recorder is
# installed) and its Prometheus text exporter, without its HTTP server.
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# OTLP trace export over HTTP/protobuf, sent with our own reqwest client.
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["trace", "http-proto"] }
opentelemetry-http = { version = "0.33.0", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
# Pixiv ugoira: zips of frames.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Reading XMP metadata from uploaded files.
quick-xml = "0.42.0"
# ONNX Runtime for the tagger, loaded at run time (libonnxruntime.so), so
# building needs no download and other builds don't carry it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "tracing"] }
# Two-factor enrolment QR codes, as inline SVG.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
mime_guess = "2.0.5"
# S3 support without aws-lc-rs: signing via ring, TLS via reqwest + rustls/ring.
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp", "connection-manager", "script", "aio", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
encoding_rs = "0.8.41"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "stream"] }
fluent-bundle = "0.16.0"
fluent-langneg = "0.13.1"
minijinja = { version = "2.24.0", features = ["loader", "urlencode", "json"] }
rpassword = "7.5.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
hmac = "0.13.0"
# TOTP (RFC 6238) is HMAC-SHA1.
sha1 = "0.11.0"
sha2 = "0.11.0"
unic-langid = "0.9.6"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "macros",
    "migrate",
    "json",
    "time",
    "ipnet",
] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "catch-panic",
    "compression-full",
    "csrf",
    "request-id",
    "set-header",
    "timeout",
    "trace",
    "util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["macros", "time", "axum_extras", "preserve_order"] }
utoipa-axum = "0.3.0"
# Passkeys (WebAuthn). Its signature checks use the system's OpenSSL;
# tests use OpenSSL directly to play the authenticator.
webauthn-rs = { version = "0.5.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
openssl = "0.10.81"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
