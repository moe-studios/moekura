[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/uwuumoe/uwuubooru"
publish = false

[workspace.dependencies]
uwuu-core = { path = "crates/core" }
uwuu-db = { path = "crates/db" }
uwuu-jobs = { path = "crates/jobs" }
uwuu-media = { path = "crates/media" }
uwuu-storage = { path = "crates/storage" }
uwuu-web = { path = "crates/web" }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
axum-extra = { version = "0.12.6", features = ["cookie", "form"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
futures-util = "0.3.34"
governor = "0.10.4"
hex = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
http-body-util = "0.1.5"
md-5 = "0.11.0"
mime_guess = "2.0.5"
# S3 support without aws-lc-rs: signing via ring, TLS via reqwest + rustls/ring.
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "stream"] }
minijinja = { version = "2.24.0", features = ["loader"] }
rpassword = "7.5.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "macros",
    "migrate",
    "json",
    "time",
    "ipnet",
] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "catch-panic",
    "compression-full",
    "csrf",
    "request-id",
    "set-header",
    "timeout",
    "trace",
    "util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
