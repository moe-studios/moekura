# git-cliff drafts changelog entries from conventional commits. Before
# tagging a release:
#
#   git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md
#
# then edit the new section into release notes people can read.

[changelog]
header = ""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Faster" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^build", group = "<!-- 4 -->Packaging" },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^(chore|ci|test|style)", skip = true },
    # Anything else that looks conventional (the early "M2: …" merges).
    { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
