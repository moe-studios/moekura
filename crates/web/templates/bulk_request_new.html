{% extends "base.html" %}
{% block title %}{{ t("bur-new-title") }} · {{ site.name }}{% endblock %}
{% block content %}
{% include "tag_nav.html" %}
<p class="back"><a href="/tags/requests">« {{ t("bur-title") }}</a></p>
<h1>{{ t("bur-new-title") }}</h1>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form class="wiki-form" method="post" action="/tags/requests">
  <label for="request-title">{{ t("field-title") }}</label>
  <input id="request-title" name="title" value="{{ form.title }}" maxlength="200" required>
  <label for="request-script">{{ t("bur-script") }}</label>
  <textarea id="request-script" name="script" rows="10" spellcheck="false" required>{{ form.script }}</textarea>
  <p class="hint">{{ t("bur-script-hint") }}</p>
  <label for="request-reason">{{ t("reason") }} <span class="optional">{{ t("optional") }}</span></label>
  <textarea id="request-reason" name="reason" rows="4">{{ form.reason }}</textarea>
  <button type="submit">{{ t("bur-send") }}</button>
</form>
{% endblock %}
