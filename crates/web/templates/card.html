{# A post thumbnail in a grid; `card` is set by the including page. #}
<a href="{{ card.href }}" class="card rating-{{ card.rating }}{% if card.pending %} is-pending{% endif %}{% if card.deleted %} is-deleted{% endif %}">
  {% if card.thumb %}
  <img class="thumb" src="{{ card.thumb }}"{% if card.thumb_2x %} srcset="{{ card.thumb }} 1x, {{ card.thumb_2x }} 2x"{% endif %}
       width="{{ card.width }}" height="{{ card.height }}" alt="Post #{{ card.id }}" loading="lazy" decoding="async">
  {% else %}
  <img class="thumb pending-media" src="{{ asset('processing.svg') }}"
       width="{{ card.width }}" height="{{ card.height }}" alt="Post #{{ card.id }} (still processing)">
  {% endif %}
  {% if card.video %}<span class="badge">video</span>{% elif card.animated %}<span class="badge">anim</span>{% endif %}
</a>
