{% extends "base.html" %}
{% block title %}{{ t("comment-edit-title") }} · {{ site.name }}{% endblock %}
{% block content %}
<p class="back"><a href="{{ url }}">« {{ t("post-number", id=post_id) }}</a></p>
<h1>{{ t("comment-edit-title") }}</h1>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form class="comment-form" method="post" action="/comments/{{ id }}/edit">
  <label for="comment-body">{{ t("comment-field") }}</label>
  <textarea id="comment-body" name="body" rows="8" maxlength="{{ max_len }}" required>{{ body }}</textarea>
  {% include "comment_help.html" %}
  <button type="submit">{{ t("common-save") }}</button>
</form>
{% endblock %}
