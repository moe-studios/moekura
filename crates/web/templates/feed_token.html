{% extends "base.html" %}
{% block title %}{{ t("feed-token-title") }} · {{ site.name }}{% endblock %}
{% block content %}
<section class="card medium">
  <h1>{{ t("feed-token-title") }}</h1>
  <p>{{ t("feed-token-copy") }}</p>
  <p><code class="token">{{ token }}</code></p>
  <p class="hint">{{ t("feed-token-hint") }}</p>
  <p><code class="token">{{ example }}</code></p>
  <p><a href="/settings">{{ t("back-to-settings") }}</a></p>
</section>
{% endblock %}
