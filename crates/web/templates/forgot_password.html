{% extends "base.html" %}
{% block title %}{{ t("forgot-title") }} · {{ site.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t("forgot-title") }}</h1>
  {% if sent %}
  <p>{{ t("forgot-sent", email=email) }}</p>
  <p class="aside"><a href="/login">{{ t("forgot-back") }}</a></p>
  {% else %}
  <p>{{ t("forgot-intro") }}</p>
  <form method="post" action="/forgot-password">
    <label for="email">{{ t("account-email") }}</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    <button type="submit">{{ t("resend-send") }}</button>
  </form>
  {% endif %}
</section>
{% endblock %}
