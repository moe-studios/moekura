{% extends "base.html" %}
{% block title %}New topic · Forum · {{ site.name }}{% endblock %}
{% block content %}
<p class="back"><a href="/forum_topics">« Forum</a></p>
<h1>New topic</h1>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form class="wiki-form" method="post" action="/forum_topics">
  <label for="topic-category">Category</label>
  <select id="topic-category" name="category" required>
    {% for c in categories %}<option value="{{ c.id }}"{% if category == c.id %} selected{% endif %}>{{ c.name }}</option>{% endfor %}
  </select>
  <label for="topic-title">Title</label>
  <input id="topic-title" name="title" value="{{ title }}" maxlength="200" required>
  <label for="topic-body">First post</label>
  <textarea id="topic-body" name="body" rows="10" required>{{ body }}</textarea>
  {% include "comment_help.html" %}
  <button type="submit">Post</button>
</form>
{% endblock %}
