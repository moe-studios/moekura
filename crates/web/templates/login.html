{% extends "base.html" %}
{% block title %}Log in · {{ site.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ name }}" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  {% if site.registration_open %}
  <p class="aside">No account yet? <a href="/register{% if next %}?next={{ next|urlencode }}{% endif %}">Register</a></p>
  {% endif %}
</section>
{% endblock %}
