{% extends "base.html" %}
{% block title %}{{ t("login-code-title") }} · {{ site.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t("login-code-heading") }}</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login/code">
    <label for="code">{{ t("login-code-field") }}</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus
           autocapitalize="none" spellcheck="false">
    <p class="hint">{{ t("login-code-hint") }}</p>
    <button type="submit">{{ t("nav-log-in") }}</button>
  </form>
</section>
{% endblock %}
