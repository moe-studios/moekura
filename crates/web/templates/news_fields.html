<label for="news-body">{{ t("news-field-body") }}</label>
<textarea id="news-body" name="body" rows="3" maxlength="{{ max_len }}" required>{{ form.body }}</textarea>
<p class="hint">{{ t("news-field-body-hint") }}</p>
<label for="news-until">{{ t("news-field-until") }} <span class="optional">{{ t("optional") }}</span></label>
<input id="news-until" name="until" type="date" value="{{ form.until }}">
<p class="hint">{{ t("news-field-until-hint") }}</p>
