{% extends "base.html" %}
{% block title %}{{ t("resend-title") }} · {{ site.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t("resend-title") }}</h1>
  <p>{{ t("resend-intro") }}</p>
  <form method="post" action="/verify-email/resend">
    <label for="name">{{ t("account-name") }}</label>
    <input id="name" name="name" autocomplete="username" required autofocus>
    <button type="submit">{{ t("resend-send") }}</button>
  </form>
</section>
{% endblock %}
