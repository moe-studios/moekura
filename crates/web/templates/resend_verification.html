{% extends "base.html" %}
{% block title %}Confirm your email address · {{ site.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Confirm your email address</h1>
  <p>Enter your account name, and we'll send the link to confirm your address again.</p>
  <form method="post" action="/verify-email/resend">
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="username" required autofocus>
    <button type="submit">Send the link</button>
  </form>
</section>
{% endblock %}
