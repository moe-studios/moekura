{% extends "base.html" %}
{% block title %}{{ t("reset-title") }} · {{ site.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t("reset-title") }}</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="password">{{ t("password-new") }}</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="256" autofocus>
    <label for="password_confirm">{{ t("password-repeat") }}</label>
    <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
    <p class="hint">{{ t("reset-hint") }}</p>
    <button type="submit">{{ t("password-change") }}</button>
  </form>
</section>
{% endblock %}
