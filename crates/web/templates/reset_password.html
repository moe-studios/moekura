{% extends "base.html" %}
{% block title %}Choose a new password · {{ site.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Choose a new password</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="256" autofocus>
    <label for="password_confirm">Repeat it</label>
    <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
    <p class="hint">This logs you out everywhere, so you'll log in again with the new password.</p>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
