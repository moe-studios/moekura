# uwubooru configuration
#
# Copy to uwubooru.toml (read from the working directory) or pass
# --config <path>. Every key can also be set through the environment:
# UWU_<SECTION>__<KEY>, e.g. UWU_DATABASE__URL. Environment variables win
# over this file. Values shown are the defaults unless noted.
#
# `uwubooru check-config` prints the effective settings.

[server]
# Address the HTTP server listens on.
bind = "0.0.0.0:8080"
# The URL users reach the site at. Set this to your https:// address in
# production: it marks cookies Secure and limits which origin may submit forms.
public_url = "http://localhost:8080"
# Reverse proxies (addresses or CIDR ranges) allowed to report the client's
# IP in X-Forwarded-For. Set this when running behind Caddy, nginx or a load
# balancer, or every visitor will appear to come from the proxy.
trusted_proxies = []   # e.g. ["127.0.0.1/32", "10.0.0.0/8"]
# Requests running longer than this are aborted with 408.
request_timeout_secs = 30

[database]
# Required. Connection URL of the primary.
url = "postgres://uwu:CHANGE_ME@localhost/uwu"
# Read replicas for search and listings. Leave empty to use the primary.
replicas = []
# Replicas further behind the primary than this are skipped until they
# catch up. After someone changes something, their reads stay on the
# primary this long, so they see their change.
replica_max_lag_secs = 10
# Maximum connections per pool (the primary and each replica).
max_connections = 16
min_connections = 0
# Seconds to wait for a free pooled connection.
acquire_timeout_secs = 5
# Server-side limit per statement in milliseconds; 0 disables it.
statement_timeout_ms = 30000
# Apply pending migrations when `serve` starts. For multi-node deployments,
# set this to false and run `uwubooru migrate` as a release step.
auto_migrate = true

[auth]
# A login session ends after this many days without use...
session_idle_days = 30
# ...or this many days after logging in, however active.
session_max_days = 365

[jobs]
# Background jobs (thumbnails, hashing) processed concurrently per process.
workers = 2
# Also run workers inside `serve`. Set to false when you run separate
# `uwubooru worker` processes.
run_in_serve = true
# Seconds before a job whose worker stopped responding is retried elsewhere.
lock_timeout_secs = 300

[search]
# Posts per page, and the most a search may ask for with limit:.
per_page = 40
max_per_page = 200
# Deepest numbered page; "next" links keep working beyond it.
max_page = 1000
# Most tags and filters in one search.
max_terms = 40
# Most tags a wildcard like long_* expands to (the most used ones).
wildcard_limit = 100
# Result counts are exact up to this many posts and estimated above.
count_limit = 10000
# Counts PostgreSQL expects to cost more than this (roughly pages read) are
# estimated instead, so filters no index covers don't read every post.
count_cost_limit = 25000

[storage]
# "local" (a directory) or "s3" (any S3-compatible store).
backend = "local"
# Directory for the local backend. Back it up along with the database.
path = "data"
# Where browsers load files from, e.g. a CDN in front of your bucket. When
# unset, the app serves files itself under /data/.
# public_base_url = "https://cdn.example.com"

[storage.s3]
bucket = ""
region = "us-east-1"
# For MinIO, Garage, R2, B2 etc. Leave unset for AWS.
# endpoint = "http://localhost:9000"
# Leave empty to use AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY or instance
# credentials. Prefer UWU_STORAGE__S3__SECRET_ACCESS_KEY over this file.
access_key_id = ""
secret_access_key = ""
# Put the bucket in the path (http://host/bucket/key); most self-hosted
# stores need this.
path_style = false

[media]
max_upload_mb = 100
# Images with more pixels are refused before decoding (decompression bombs).
max_pixels = 200000000
max_duration_secs = 600
# Add "jxl" to accept JPEG XL. It is off by default because libvips marks
# its JPEG XL decoder as not hardened against malicious files; the decoder
# still runs in a separate, time-limited process.
allowed_types = ["jpeg", "png", "gif", "webp", "avif", "mp4", "webm"]
# Thumbnail bounding boxes: 1x and 2x for high-DPI screens.
thumbnail_sizes = [250, 500]
# Images larger than this also get a resized copy for the post page.
sample_size = 1600
# "webp" or "avif" (smaller, slower to encode).
variant_format = "webp"
tool_timeout_secs = 120
# Scratch space for uploads and processing; the system temp dir by default.
# work_dir = "/var/tmp/uwubooru"

[media.tools]
# Paths to the media programs, if they are not on PATH.
vips = "vips"
vipsheader = "vipsheader"
vipsthumbnail = "vipsthumbnail"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"

[paths]
# Directories whose files replace built-in templates and static files with
# the same relative path, e.g. <templates_override>/base.html. Unset by default.
# templates_override = "/etc/uwubooru/templates"
# static_override = "/etc/uwubooru/static"

[telemetry]
# "text" or "json".
log_format = "text"
# tracing filter directive. RUST_LOG overrides it.
# "info,tower_http=debug" also logs every request.
log_filter = "info,sqlx::postgres::notice=warn"
